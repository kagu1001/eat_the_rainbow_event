<!DOCTYPE html>
<html lang="da">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lav dit eget samtalekort | Eat the Rainbow</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./starter.css">
  <link rel="stylesheet" href="./style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang&display=swap" rel="stylesheet">
</head>

<body>


  <header class="site-header">
    <div class="header-content">

      <a href="./index.html" class="site-logo">
        <img src="./imgs/logo.webp" alt="Eat the Rainbow logo">
      </a>

      <nav class="site-nav">
        <button type="button" popovertarget="menu">
          Menu
        </button>

        <ul class="menu" id="menu" popover>
          <li><a href="./index.html">Forside</a></li>
          <li><a href="./svg.html">Program</a></li>
          <li>
            <a href="./form.html" aria-current="page">
              Formular
            </a>
          </li>
        </ul>
      </nav>

    </div>
  </header>


  <main>

    <section class="samtalekort-section">

      <h1>Lav dit eget samtalekort</h1>


      <img src="./imgs/strawberry-big.svg" alt="En glad jordbærfigur" class="strawberry-peek">


      <form class="samtalekort-form" action="./opsamling.html" method="GET">


        <div class="form-field">

          <label for="alder">
            Barnets alder
          </label>

          <input type="number" id="alder" name="alder" min="1" max="18" placeholder="F.eks. 8" required>

        </div>


        <div class="form-field">

          <label for="frugt">
            Barnets yndlingsfrugt
          </label>

          <select id="frugt" name="frugt" required>

            <option value="" disabled selected>
              Vælg en frugt...
            </option>

            <option value="kiwi">
              🥝 Kiwi
            </option>

            <option value="banan">
              🍌 Banan
            </option>

            <option value="jordbær">
              🍓 Jordbær
            </option>

          </select>

        </div>


        <div class="form-field">

          <label for="samtale">
            Er der noget særligt, I gerne vil tale om?
          </label>

          <input type="text" id="samtale" name="samtale" placeholder="Skriv her...">

        </div>


        <div class="checkbox-section">

          <h3>
            Hvilke emner vil I gerne snakke om?
          </h3>

          <p>Vælg gerne flere emner</p>

          <div class="checkbox-grid">

            <label class="checkbox-option">
              <input type="checkbox" name="emner" value="Mad og sundhed">
              <span>Mad og sundhed 🍎</span>
            </label>

            <label class="checkbox-option">
              <input type="checkbox" name="emner" value="Følelser og trivsel">
              <span>Følelser og trivsel 💗</span>
            </label>

            <label class="checkbox-option">
              <input type="checkbox" name="emner" value="Familie og hverdag">
              <span>Familie og hverdag 🏡</span>
            </label>

            <label class="checkbox-option">
              <input type="checkbox" name="emner" value="Venner og fællesskab">
              <span>Venner og fællesskab 🌼</span>
            </label>

            <label class="checkbox-option">
              <input type="checkbox" name="emner" value="Drømme og fantasi">
              <span>Drømme og fantasi ✨</span>
            </label>

            <label class="checkbox-option">
              <input type="checkbox" name="emner" value="Sjove spørgsmål">
              <span>Sjove spørgsmål 🌈</span>
            </label>

          </div>

        </div>


        <button type="submit" class="samtalekort-button">
          Lav mit samtalekort →
        </button>

      </form>

    </section>

  </main>


  <footer class="site-footer">
    <div class="footer-content">
      <p>Eat the Rainbow</p>
      <p>© 2026</p>
    </div>
  </footer>

  <script src="./script.js"></script>

</body>

</html>
